name: Docs & Design Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 检查文档链接与结构
        run: node scripts/check-docs.mjs
      - name: 检查设计 token 对比度
        run: node scripts/check-contrast.mjs
      - name: 安装依赖
        run: npm ci
      - name: 构建站点
        run: npm run build
      - name: 校验 i18n 产物
        run: node scripts/check-i18n.mjs
      - name: 构建产物安全检查
        run: node scripts/check-security.mjs
